
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TU Meet - Chat</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/Chat.css?v=3">
    <script src="../js/Header.js"></script>
</head>

<body>
<div class="app-container">

    <!-- Header -->
    <header class="app-header">
      <div class="header-left">
        <div class="logo">
          <a href="./Homepage.html" aria-label="กลับไปหน้า Home">
            <img src="../Picture/LogoTUmeet.svg" alt="TU Meet Logo">
          </a>
        </div>
        <nav class="header-nav" aria-label="เมนูหลัก">
          <a href="./Homepage.html" class="header-nav-link">หน้าแรก</a>
          <a href="./Homepage.html#eventList" class="header-nav-link">กิจกรรมทั้งหมด</a>
        </nav>
      </div>
      <div class="header-actions">
        <!-- Notification -->
        <a href="#" class="icon-btn" aria-label="Notifications">
          <img src="../Picture/NotificationIcon.svg" alt="Notifications">
        </a>
        <!-- Profile Dropdown -->
        <div class="profile-dropdown">
          <button class="icon-btn profile-trigger" id="profileBtn" type="button" aria-label="Profile"
            aria-expanded="false">
            <img src="../Picture/profile.svg" alt="Profile">
          </button>
          <!-- กรณี Login แล้ว -->
          <div class="dropdown-menu" id="loggedInMenu" hidden>
            <a href="./Profile.html" class="dropdown-item">
              <img src="../Picture/profile-menu.svg" alt="">
              <span>โปรไฟล์</span>
            </a>
            <button type="button" class="dropdown-item" id="logoutBtn">
              <img src="../Picture/logout.svg" alt="">
              <span>ออกจากระบบ</span>
            </button>
          </div>
          <!-- กรณียังไม่ได้ Login -->
          <div class="dropdown-menu" id="guestMenu" hidden>
            <a href="./Login.html" class="dropdown-item">
              <img src="../Picture/ProfileIcon.svg" alt="">
              <span>เข้าสู่ระบบ</span>
            </a>
          </div>
        </div>
      </div>
    </header>

    <main class="chat-page">

        <!-- หน้าแสดงรายชื่อแชท -->
        <section id="chatListPage">

            <div class="chat-logo-banner">
                <img src="../Picture/chat-section-logo%201.svg" alt="CHAT NOW" class="chat-section-logo">
            </div>

            <div id="chatList" class="chat-list">
                <p class="chat-empty-state">กำลังโหลดรายการห้องแชท...</p>
            </div>
        </section>

        <!-- หน้าแชท -->
        <section id="chatRoomPage" hidden>

            <div class="chat-room-header">
                <div class="chat-room-title-wrap">
                    <button id="backBtn" type="button" class="back-btn" aria-label="กลับไปหน้ารายชื่อแชท">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <polyline points="15 18 9 12 15 6"></polyline>
                        </svg>
                    </button>
                    <h2 id="chatName">ชื่อกิจกรรม</h2>
                </div>
                <div class="chat-room-meta">
                    <img id="chatRoomIcon" src="../Picture/book-one.svg" alt="Activity Icon" class="chat-room-icon">
                    <span id="chatRoomCapacity" class="chat-room-capacity">0/0</span>
                </div>
            </div>

            <div class="chat-room-card">
                <!-- ข้อความ -->
                <div id="messageArea" class="message-area">
                </div>

                <!-- ช่องพิมพ์ข้อความ -->
                <form id="messageForm" class="message-form">
                    <input
                        type="text"
                        id="messageInput"
                        placeholder="Message..."
                        autocomplete="off"
                        maxlength="2000"
                    >

                    <button type="submit" class="send-btn" aria-label="ส่งข้อความ">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </form>
            </div>

        </section>

    </main>
</div>

<script src="../js/Chat.js?v=3"></script>
</body>
</html>
