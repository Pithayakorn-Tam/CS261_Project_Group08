<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TU Meet</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/Homepage.css?v=4">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="../js/Homepage.js?v=4" defer></script>

    <link rel="stylesheet" href="../css/Join.css?v=4">
    <script src="../js/Join.js?v=4" defer></script>
    <script src="../js/Header.js"></script>
</head>

<body>
    <!-- กรอบจำลองหน้าจอมือถือ -->
    <div class="mobile-container">

        <header class="app-header">
      <div class="logo">
        <a href="./Homepage.html" aria-label="กลับไปหน้า Home">
          <img src="../Picture/LogoTUmeet.svg" alt="TU Meet Logo">
        </a>
      </div>
      <div class="header-actions">
        <!-- Notification -->
        <a href="#" class="icon-btn" aria-label="Notifications">
          <img src="../Picture/NotificationIcon.svg" alt="Notifications">
        </a>
        <!-- Profile Dropdown -->
        <div class="profile-dropdown">
          <button class="icon-btn profile-trigger" id="profileBtn" type="button" aria-label="Profile"
            aria-expanded="false">
            <img src="../Picture/profile.svg" alt="Profile">
          </button>
          <!-- กรณี Login แล้ว -->
          <div class="dropdown-menu" id="loggedInMenu" hidden>
            <a href="./Profile.html" class="dropdown-item">
              <img src="../Picture/profile-menu.svg" alt="">
              <span>โปรไฟล์</span>
            </a>
            <button type="button" class="dropdown-item" id="logoutBtn">
              <img src="../Picture/logout.svg" alt="">
              <span>ออกจากระบบ</span>
            </button>
          </div>
          <!-- กรณียังไม่ได้ Login -->
          <div class="dropdown-menu" id="guestMenu" hidden>
            <a href="./Login.html" class="dropdown-item">
              <img src="../Picture/ProfileIcon.svg" alt="">
              <span>เข้าสู่ระบบ</span>
            </a>
          </div>
        </div>
      </div>
    </header>


        <!-- พื้นที่เนื้อหาหลัก -->
        <main class="content">
            <!-- แบนเนอร์กิจกรรมแนะนำ -->
            <section class="recommend-section">
                <h2 class="recommend-title"><span class="highlight">R</span>ECOMMEND <span
                        class="highlight">A</span>CTIVITIES</h2>

                <!-- กรอบรูปภาพ -->
                <div class="carousel-container">
                    <div class="carousel-slide" id="carouselSlide">
                        <!-- ใส่รูปภาพหรือแบนเนอร์ด้านใน -->
                        <!-- สไลด์รูปที่ 1 -->
                        <div class="carousel-item">
                            <img src="../Picture/banner-image-1.svg" alt="Banner 1" class="banner-img">
                        </div>
                        <!-- สไลด์รูปที่ 2 -->
                        <div class="carousel-item">
                            <img src="../Picture/banner-image-2.svg" alt="Banner 2" class="banner-img">
                        </div>
                        <!-- สไลด์รูปที่ 3 -->
                        <div class="carousel-item">
                            <img src="../Picture/banner-image-3.svg" alt="Banner 3" class="banner-img">
                        </div>
                    </div>
                </div>

                <!-- จุดเลื่อนด้านล่าง -->
                <div class="carousel-dots">
                    <span class="dot active"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                </div>
            </section>

            <!-- ปุ่มสร้างกิจกรรม -->
            <section class="create-event-section">
                <button class="create-btn" id="createEventBtn">
                    <div class="create-text">
                        <span class="eng">CREATE YOUR EVENT</span>
                        <span class="th">สร้างกิจกรรมของคุณ</span>
                    </div>
                    <div class="create-icon">+</div>
                </button>
            </section>

            <!-- หัวข้อ Feed และตัวกรอง -->
            <section class="feed-header-section">
                <div class="feed-title-container">
                    <h3 class="feed-title-th">กิจกรรมที่กำลังหาเพื่อน <span class="exclaim-red">!</span></h3>
                    <h3 class="feed-title-en">Join your friends here <span class="exclaim-blue">!</span></h3>
                </div>

                <div class="filter-container">
                    <div class="filter-label">กำลังแสดง<br>now showing</div>
                    <select class="filter-dropdown">
                        <option value="all">ทั้งหมด</option>
                        <option value="academic">วิชาการ</option>
                        <option value="sport">กีฬา</option>
                        <option value="entertainment">บันเทิง</option>
                        <option value="lifestyle">ไลฟ์สไตล์</option>
                        <option value="other">อื่นๆ</option>
                    </select>
                </div>
            </section>

            <!-- รายการกิจกรรม (ดึงจากฐานข้อมูลผ่าน Homepage.js เท่านั้น) -->
            <section class="event-feed">
                <div class="event-list" id="eventList"></div>
            </section>
            <section class="load-more-btn">
                <button id="loadMoreBtn">แสดงเพิ่มเติม</button>
            </section>
        </main>

    </div>

    <!-- พื้นที่โหลด Popup  -->
    <div id="joinPopupContainer"></div>
    <!-- Sticky Chat Button -->
    <a href="Chat.html" class="sticky-chat-btn" aria-label="เปิดหน้าแชท">
        <img src="../Picture/chat-outline.svg" alt="Chat">
    </a>
</body>

</html>
