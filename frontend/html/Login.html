<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TU MEET - Login</title>

    <!-- Google Fonts: Mitr และ Lilitta One -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lilitta+One&family=Mitr:wght@300;400;500&display=swap"
        rel="stylesheet">

    <!-- เชื่อมโยงไฟล์ CSS ภายนอก -->
    <link rel="stylesheet" href="../css/Login.css">
</head>

<body>

    <!-- กล่องฟอร์มหลัก -->
    <div class="login-container">

        <!-- ส่วนแสดงรูปภาพโลโก้ -->
        <div class="logo-wrapper">
            <!-- เปลี่ยนชื่อไฟล์ logo.png ให้ตรงกับรูปที่คุณมี -->
            <img src="../Picture/LogoTUmeet.svg" alt="TU MEET Logo" class="logo-img">
        </div>

        <!-- ฟอร์มเข้าสู่ระบบ -->
        <form id="loginForm">

            <!-- ช่องกรอก Username -->
            <div class="input-group">
                <input type="text" id="username" required placeholder="username 6XXXXXXXXX">
            </div>

            <!-- ช่องกรอก Password -->
            <div class="input-group">
                <input type="password" id="password" required placeholder="password รหัสบัตรประชาชน">
            </div>
            <!-- ปุ่ม LOGIN -->
            <button type="submit" id="submitBtn" class="login-btn">
                LOGIN
            </button>
            <!-- กล่องแจ้งเตือน Error -->
            <div id="errorBox" class="error-box hidden"></div>


        </form>

    </div>

    <!-- เชื่อมโยงไฟล์ JavaScript ภายนอก -->
    <script src="../js/Login.js"></script>
</body>

</html>
