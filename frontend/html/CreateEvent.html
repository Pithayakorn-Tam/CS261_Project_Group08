<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Your Event</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/CreateEvent.css">
</head>
<body>

  <div class="app-container">

<!-- Header Bar (ใช้เหมือนกันทั้ง Homepage, CreateEvent, Profile) -->
<header class="app-header">
  <div class="logo">
    <a href="./Homepage.html" aria-label="กลับไปหน้า Home">
      <img src="../Picture/LogoTUmeet.svg" alt="TU Meet Logo">
    </a>
  </div>
  <div class="header-actions">
    <a href="#" class="icon-btn" aria-label="การแจ้งเตือน">
      <img src="../Picture/NotificationIcon.svg" alt="Notifications">
    </a>
    <a href="./Profile.html" class="icon-btn" aria-label="ไปหน้า Profile">
      <img src="../Picture/ProfileIcon.svg" alt="Profile">
    </a>
  </div>
</header>

    <main class="main-content">
      <div class="banner">
        <img src="../Picture/create-event-logo.svg" alt="Create Your Event Logo" class="logo-banner">
      </div>

      <section class="event-panel" aria-labelledby="event-details-title">
        <form class="event-form" novalidate>
        <!-- กล่องแจ้งเตือนรวมด้านบน (ถ้ามี) -->
        <div id="errorBox" class="error-box hidden"></div>

        <div class="form-group form-group-row event-type-group">
          <label for="eventType">Event Type</label>
          <div class="select-wrapper">
            <select name="eventType" id="eventType">
              <option value="" disabled selected hidden>หมวดหมู่</option>
              <option value="academic">วิชาการ</option>
              <option value="sport">กีฬา</option>
              <option value="entertainment">บันเทิง</option>
              <option value="life-style">ไลฟ์สไตล์</option>
              <option value="other">อื่นๆ</option>            
            </select>
          </div>
          <small id="typeError" class="error-message"></small>
        </div>

        <div class="form-group event-name-group">
          <label for="eventName">Event Name</label>
          <input type="text" id="eventName" name="eventName" placeholder="ตัวอย่าง ไปกินตี๋น้อย">
          <small id="nameError" class="error-message"></small>
        </div>

        <div class="form-group location-group">
          <label for="eventLocation">Location</label>
          <input type="text" id="eventLocation" name="eventLocation" placeholder="ตัวอย่าง สุกี้ตี๋น้อย สาขา...">
          <small id="locationError" class="error-message"></small>
        </div>

        <div class="form-group description-group">
          <label for="eventDescription">Description</label>
          <textarea id="eventDescription" name="eventDescription" placeholder="รายละเอียดเพิ่มเติมเกี่ยวกับกิจกรรม..." rows="3"></textarea>
          <small id="descError" class="error-message"></small>
        </div>

        <div class="form-row">
          <div class="form-group size-group">
            <label for="eventSize">Size</label>
              <div class="select-wrapper size-select-wrapper">

                <!-- Select เดิม เก็บไว้ส่งค่าให้ Backend -->
                <select name="eventSize" id="eventSize" class="size-native-select">
                  <option value="2" selected>2</option>
                  <option value="3">3</option>
                  <option value="4">4</option>
                  <option value="5">5</option>
                  <option value="6">6</option>
                  <option value="7">7</option>
                  <option value="8">8</option>
                  <option value="9">9</option>
                  <option value="10">10</option>
                  <option value="11">11</option>
                  <option value="12">12</option>
                  <option value="13">13</option>
                  <option value="14">14</option>
                  <option value="15">15</option>
                  <option value="16">16</option>
                  <option value="17">17</option>
                  <option value="18">18</option>
                  <option value="19">19</option>
                  <option value="20">20</option>
                </select>

                <!-- ปุ่ม Dropdown -->
                <button type="button" id="sizeDropdownBtn"
                        class="size-dropdown-btn">
                  <span id="sizeSelected">2</span>
                  <span class="size-arrow"></span>
                </button>

                <!-- รายการตัวเลือก -->
                <div id="sizeDropdownMenu" class="size-dropdown-menu hidden">
                </div>

              </div>
          </div>

          <div class="form-group date-group">
            <label for="eventDate">Date</label>
            <input type="date" id="eventDate" class="eventDate" name="eventDate" placeholder="dd/mm/yy">
            <small id="dateError" class="error-message"></small>
          </div>

          <div class="form-group time-group">
            <label for="eventTime">Time</label>
            <input type="time" id="eventTime" class="eventTime" name="eventTime">
            <small id="timeError" class="error-message"></small>
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn-create">CREATE</button>
        </div>
        </form>
      </section>
    </main>
  </div>
<script src="../js/api.js?v=3"></script>
<script src="../js/CreateEvent.js?v=3"></script>
</body>
</html>
