services:
  tumeet-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: tumeet-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "TuMeet_StrongPass123!"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    command: >
      /bin/bash -c "
      /opt/mssql/bin/sqlservr &
      sleep 15 &&
      (/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'TuMeet_StrongPass123!' -C -Q \"IF NOT EXISTS (SELECT name FROM sys.databases WHERE name = N'tumeetdb') CREATE DATABASE [tumeetdb];\" ||
       /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'TuMeet_StrongPass123!' -Q \"IF NOT EXISTS (SELECT name FROM sys.databases WHERE name = N'tumeetdb') CREATE DATABASE [tumeetdb];\") ;
      wait
      "
    restart: unless-stopped

volumes:
  mssql-data:
