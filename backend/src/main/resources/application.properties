spring.application.name=backend

# Import local .env files (ignored by .gitignore) if present
spring.config.import=optional:file:./.env[.properties],optional:file:./backend/.env[.properties]

# Database Configuration (Uses DB_HOST in Docker, defaults to localhost for local development)
spring.datasource.url=jdbc:sqlserver://${DB_HOST:localhost}:1433;databaseName=${DB_NAME:tumeetdb};encrypt=false;trustServerCertificate=true
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:TuMeet_StrongPass123!}
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_nationalized_character_data=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# TU REST API v1 Configuration (POST /api/v1/auth/Ad/verify)
tu.api.url=https://restapi.tu.ac.th/api/v1/auth/Ad/verify
# Token (Application-Key) - loaded from .env (TU_API_KEY) or configured here (protected by git filter=strip-tu-key)
tu.api.key=