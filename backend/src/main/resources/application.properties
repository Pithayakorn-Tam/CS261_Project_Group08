spring.application.name=backend

# Database Configuration (Uses DB_HOST in Docker, defaults to localhost for local development)
spring.datasource.url=jdbc:sqlserver://${DB_HOST:localhost}:1433;databaseName=${DB_NAME:tumeetdb};encrypt=false;trustServerCertificate=true
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:TuMeet_StrongPass123!}
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_nationalized_character_data=true

# TU REST API Configuration
# TODO: Insert the TU Application-Key token below once generated
tu.api.url=https://restapi.tu.ac.th/api/v2/profile/std/info/?id=
tu.api.key=